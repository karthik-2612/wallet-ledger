[project]
name = "wallet-ledger"
version = "0.1.0"
description = "A small wallet ledger REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[project.scripts]
wallet-ledger = "wallet_ledger.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wallet_ledger --cov-report=term-missing --cov-fail-under=90"
